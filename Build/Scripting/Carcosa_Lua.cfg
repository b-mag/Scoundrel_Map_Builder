/*******************************************************************\
	Doom Builder script definitions for Carcosa Lua event scripts

	Stored in the CARCLUA map lump as plain UTF-8 Lua source. There is no
	compiler: the lump is the payload, so no "compiler", "parameters" or
	"resultlump" is declared here. The Scoundrel engine loads the lump into a
	sandboxed LuaJ VM on map load.

	Event functions the engine calls (all optional):
	  on_load()                  map finished loading
	  on_use(id, thing_type)     ACTION on a thing; return true to suppress default
	  on_enter(sector, place)    player entered a new sector
	  on_kill(id, thing_type)    entity died
	  on_purify(id)              a Lum fountain was purified
	  on_tick(dt)                every frame
	  on_choice(id, answer)      player picked option 1 or 2 from carcosa.ask

	The sandbox exposes base, string, table, math and bit32 only. There is no
	io, os, package or require, so a map script cannot reach the filesystem.

	See scoundrel/docs/carcosa/LUA_SCRIPTING.md for the full reference.
\*******************************************************************/

// Editor settings
description = "Carcosa Lua Event Script";
codepage = 0;
extensions = "lua";
casesensitive = true;
insertcase = 0;				// 0=Normal, 1=Lowercase, 2=Uppercase
lexer = 15;					// SCLEX_LUA
functionopen = "(";
functionclose = ")";
argumentdelimiter = ",";
terminator = "";
keywordhelp = "";

keywords
{
	// --- Lua language
	and = "and";
	break = "break";
	do = "do";
	else = "else";
	elseif = "elseif";
	end = "end";
	false = "false";
	for = "for";
	function = "function";
	if = "if";
	in = "in";
	local = "local";
	nil = "nil";
	not = "not";
	or = "or";
	repeat = "repeat";
	return = "return";
	then = "then";
	true = "true";
	until = "until";
	while = "while";

	// --- Engine event entry points
	on_load = "on_load() — called once after the map finishes loading";
	on_use = "on_use(id, thing_type) — ACTION pressed on a thing. Return true to suppress the default interaction";
	on_enter = "on_enter(sector, place) — player entered a different sector";
	on_kill = "on_kill(id, thing_type) — an entity was killed";
	on_purify = "on_purify(id) — a Lum fountain was purified with the crystal flask";
	on_tick = "on_tick(dt) — called every frame with the frame time in seconds";
	on_choice = "on_choice(id, answer) — player answered carcosa.ask; answer is 1 or 2";

	// --- carcosa.* API
	log = "carcosa.log(text) — append a line to the on-screen message log";
	say = "carcosa.say(speaker, text) — show a line of dialogue";
	flag = "carcosa.flag(name) — read a persistent world flag (boolean)";
	set_flag = "carcosa.set_flag(name, value) — write a persistent world flag";
	counter = "carcosa.counter(name) — read a persistent integer counter";
	add_counter = "carcosa.add_counter(name, delta) — add to a counter, returns the new value";
	heal = "carcosa.heal(amount) — restore health";
	restore_mana = "carcosa.restore_mana(amount) — restore essence";
	give_flask = "carcosa.give_flask(count) — add charges to the crystal flask";
	raise_flask = "carcosa.raise_flask(count) — permanently raise flask capacity";
	travel = "carcosa.travel(region_id) — move the player to another region";
	open_tag = "carcosa.open_tag(tag) — open every door carrying this tag";
	play = "carcosa.play(sound_id) — play a sound: \"ui\", \"hit\" or \"interact\"";
	spawn = "carcosa.spawn(thing_type, x, y) — spawn a thing archetype";
	eat = "carcosa.eat(food_id) — apply a ration buff by FoodCatalog id";
	has_item = "carcosa.has_item(id) — true if the satchel holds this quest item";
	give_item = "carcosa.give_item(id) — put a quest item into the satchel";
	take_item = "carcosa.take_item(id) — remove a quest item from the satchel";
	ask = "carcosa.ask(choice_id, prompt, a, b) — show a two-button choice; later fires on_choice";
	hide = "carcosa.hide(entity_id) — hide / despawn a world entity (pickups)";
	moon = "carcosa.moon(id, az, el [, scale [, phase [, alpha]]]) — place sky moon 1 or 2; phase 0=new 0.5=full";
	time = "carcosa.time() — seconds since new game (persists across maps and saves)";
	set_time = "carcosa.set_time(seconds) — set world time (debug / cutscenes)";
	sky_clock = "carcosa.sky_clock(day_sec, night_sec) — solar day length; defaults 300/300";
	moon_month = "carcosa.moon_month(id, days [, phase0]) — lunar month in solar days; phase0 0=new 0.5=full at t=0";
	tod = "carcosa.tod(dayness) — 0 night .. 1 day, overrides the clock for this frame";
}

constants
{
	carcosa = "carcosa";
}
